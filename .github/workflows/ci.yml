name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check src tests benchmarks examples scripts
          python -m ruff format --check src tests benchmarks examples scripts
      - name: Test
        run: python -m pytest
      - name: Benchmark fixtures
        run: python benchmarks/synthetic_cases.py --skip-scale
      - name: Clean dataset audit
        run: python -m mlpipelinecheck audit-dataset examples/data/classification.csv --target churn --task classification --html dataset-report.html --json dataset-report.json
      - name: Severity gate fails on a target copy
        shell: bash
        run: |
          set +e
          python -m mlpipelinecheck audit-dataset examples/data/leak_target_copy.csv --target churn --task classification --min-severity high
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "expected exit code 1, got $code"
            exit 1
          fi
      - name: Build
        run: |
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlpipelinecheck-report-py${{ matrix.python-version }}
          path: |
            dataset-report.html
            dataset-report.json
